<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empadronamiento | TSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-tse { border-top: 5px solid #0d6efd; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .section-title { font-size: 1.1rem; color: #0d6efd; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; margin-bottom: 15px; }
        .captcha-img { border: 1px solid #ced4da; border-radius: 5px; max-height: 50px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🗳️ Sistema de Empadronamiento - Jutiapa</a>
            <a class="btn btn-outline-light btn-sm" href="consulta.html">Ir a Consultas</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-tse p-4 mb-5">
                    <h3 class="text-center mb-2">Ficha Oficial de Empadronamiento</h3>
                    <p class="text-muted text-center mb-4">Complete todos los campos obligatorios del ciudadano.</p>
                    
                    <form id="formRegistro">
                        
                        <!-- SECCIÓN 1: IDENTIFICACIÓN -->
                        <h5 class="section-title fw-bold">1. Datos de Identificación (DPI)</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Número de CUI</label>
                                <input type="text" class="form-control" id="cui" placeholder="13 dígitos numéricos" maxlength="13" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha de Emisión del DPI</label>
                                <input type="date" class="form-control" id="fechaEmisionDpi" required>
                            </div>
                        </div>

                        <!-- SECCIÓN 2: DATOS PERSONALES -->
                        <h5 class="section-title fw-bold mt-4">2. Datos Personales</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Primer Nombre</label>
                                <input type="text" class="form-control" id="primerNombre" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Segundo Nombre</label>
                                <input type="text" class="form-control" id="segundoNombre">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Género</label>
                                <select class="form-select" id="idGenero" required>
                                    <option value="">Cargando...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Estado Civil/Estado</label>
                                <select class="form-select" id="idEstado" required>
                                    <option value="">Cargando...</option>
                                </select>
                            </div>
                        </div>

                        <!-- SECCIÓN 3: CAPACIDADES Y DIRECCIÓN -->
                        <h5 class="section-title fw-bold mt-4">3. Capacidades y Demografía</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">¿Sabe leer y escribir?</label>
                                <select class="form-select" id="leeEscribe" required>
                                    <option value="true">Sí</option>
                                    <option value="false">No</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">¿Es Vidente?</label>
                                <select class="form-select" id="vidente" required>
                                    <option value="true">Sí</option>
                                    <option value="false">No</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Muni. de Vecindad</label>
                                <select class="form-select" id="idMuniVecindad" required>
                                    <option value="">Cargando...</option>
                                </select>
                            </div>
                        </div>

                        <!-- SECCIÓN 4: DATOS ELECTORALES -->
                        <h5 class="section-title fw-bold mt-4">4. Asignación Electoral</h5>
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Afiliación Política</label>
                                <select class="form-select" id="idAfiliacion" required>
                                    <option value="">Cargando...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Muni. de Residencia</label>
                                <select class="form-select" id="idMuniResidencia" required>
                                    <option value="">Cargando...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">ID Mesa (Asignada)</label>
                                <input type="number" class="form-control" id="idMesa" placeholder="Ej. 1" min="1" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">¿Dir. Geoelectoral?</label>
                                <select class="form-select" id="tieneDireccionGeoelectoral" required>
                                    <option value="true">Sí</option>
                                    <option value="false">No</option>
                                </select>
                            </div>
                        </div>

                        <!-- CAPTCHA -->
                        <div class="mb-4 p-3 bg-light border rounded text-center">
                            <label class="form-label fw-bold d-block">Verificación de Seguridad</label>
                            <div class="d-flex justify-content-center align-items-center mb-2">
                                <img id="imagenCaptchaReg" src="" alt="Cargando..." class="captcha-img me-3" style="display: none;">
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cargarCaptchaRegistro()">🔄 Recargar</button>
                            </div>
                            <input type="text" class="form-control text-center mx-auto" id="respuestaCaptchaReg" placeholder="Ingrese el texto" style="max-width: 200px;" required>
                            <input type="hidden" id="captchaIdOcultoReg">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">📥 Guardar Empadronamiento Oficial</button>
                        </div>
                        
                        <div id="mensajeAlerta" class="mt-3 text-center" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
