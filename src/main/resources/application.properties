
# Nombre de la aplicación Spring Boot
spring.application.name=empadronamiento-api

# --------------------------------------------------
# CONEXIÓN A SQL SERVER
# --------------------------------------------------

# Dirección IP y puerto del servidor de base de datos.
# databaseName indica la base de datos que utilizará la API.
spring.datasource.url=jdbc:sqlserver://172.16.0.100:1433;databaseName=PadronElectoral;encrypt=true;trustServerCertificate=true

# Usuario de SQL Server utilizado por la aplicación.
spring.datasource.username=app_padron

# La contraseña se obtiene de la variable de entorno DB_PASSWORD.
# Si no existe, se utiliza una cadena vacía como valor predeterminado.
spring.datasource.password=${DB_PASSWORD:}

# Permite que la aplicación pueda iniciar aunque la conexión
# inicial con la base de datos no esté disponible.
spring.datasource.hikari.initialization-fail-timeout=-1

# --------------------------------------------------
# SERVIDOR DE LA API
# --------------------------------------------------

# Puerto en el que se ejecutará la API.
server.port=8080

# --------------------------------------------------
# SWAGGER / OPENAPI
# --------------------------------------------------

# Ruta personalizada para acceder a Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html
