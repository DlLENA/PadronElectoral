spring.application.name=empadronamiento-api

# Conexion a SQL Server (la IP es la del servidor de base de datos, no la de la API)
spring.datasource.url=jdbc:sqlserver://172.16.0.100:1433;databaseName=PadronElectoral;encrypt=true;trustServerCertificate=true
spring.datasource.username=app_padron
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1

# Puerto de la API
server.port=8080

# Direccion de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html