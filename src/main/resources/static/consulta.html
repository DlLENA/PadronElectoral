
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Empadronamiento | TSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-tse { border-top: 5px solid #198754; box-shadow: 0 4px 8px rgba(0,0,0,0.1); } 
        .captcha-img { border: 1px solid #ced4da; border-radius: 5px; max-height: 60px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🔎 Consulta de Empadronamiento - Jutiapa</a>
            <a class="btn btn-outline-light btn-sm" href="registro.html">Volver al Registro</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-tse p-4 text-center mb-5">
                    <h3 class="mb-3">Verifique su estado</h3>
                    <p class="text-muted">Ingrese sus datos para consultar si ya está empadronado.</p>
                    
                    <form id="formConsulta">
                        
                        <!-- Selector de Tipo de Búsqueda -->
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Tipo de Búsqueda</label>
                            <select class="form-select border-success" id="tipoBusqueda" required>
                                <option value="DPI">DPI (CUI de 13 dígitos)</option>
                                <option value="EMPADRONAMIENTO">No. de Empadronamiento (10 caracteres)</option>
                            </select>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Número de Documento</label>
                            <input type="text" class="form-control" id="dpiConsulta" placeholder="Ej. 1234567890101 o A1B2C3D4E5" required>
                        </div>
                        
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacConsulta" required>
                        </div>

                        <!-- CAPTCHA Nativo del Backend -->
                        <div class="mb-4 p-3 bg-light border rounded">
                            <label class="form-label fw-bold d-block">Verificación de Seguridad</label>
                            <div class="d-flex justify-content-center align-items-center mb-2">
                                <img id="imagenCaptcha" src="" alt="Cargando CAPTCHA..." class="captcha-img me-3" style="display: none;">
                                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="cargarCaptchaConsulta()">🔄 Recargar</button>
                            </div>
                            <input type="text" class="form-control text-center mx-auto" id="respuestaCaptcha" placeholder="Ingrese el texto de la imagen" style="max-width: 200px;" required>
                            <input type="hidden" id="captchaIdOculto">
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success btn-lg fw-bold" type="submit" id="btnConsultar">Consultar Empadronamiento</button>
                        </div>
                    </form>

                    <div id="resultadoConsulta" class="mt-4 text-start" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
