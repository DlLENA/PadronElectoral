openapi: 3.0.3

# =====================================================================
# CONTRATO DE LA API - PADRÓN ELECTORAL (JUTIAPA)
# Ubicación en el proyecto: src/main/resources/openapi/openapi.yaml
# =====================================================================

info:
  title: API Padrón Electoral
  description: >
    API REST académica del proyecto final de Base de Datos I (UMG, Campus Jutiapa)
    para registrar y consultar empadronamientos. Usa datos ficticios.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Desarrollo local (la API corre en la PC del desarrollador)
  - url: http://172.16.0.100:8080
    description: Servidor SRV-PRJFINAL (solo si la API se despliega en la VM de la base de datos)

tags:
  - name: Empadronamientos
    description: Módulo 1 - Registro de un nuevo empadronamiento
  - name: Consultas
    description: Módulo 2 - Consulta de ciudadano empadronado
  - name: Captcha
    description: Código de verificación para evitar consultas automatizadas
  - name: Catalogos
    description: Listas para llenar los combos de la pantalla de registro

paths:
  /api/empadronamientos:
    post:
      tags: [Empadronamientos]
      operationId: registrarEmpadronamiento
      summary: Registrar un nuevo empadronamiento
      description: >
        Llama al procedimiento sp_registrar_ciudadano. La base de datos valida las
        reglas de negocio y genera el número de empadronamiento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Empadronamiento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/consultas:
    post:
      tags: [Consultas]
      operationId: consultarEmpadronamiento
      summary: Consultar si un ciudadano está empadronado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaRequest'
      responses:
        '200':
          description: Ciudadano encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/captcha:
    get:
      tags: [Captcha]
      operationId: obtenerCaptcha
      summary: Generar un nuevo código de verificación
      responses:
        '200':
          description: Captcha generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/municipios:
    get:
      tags: [Catalogos]
      operationId: listarMunicipios
      summary: Municipios de Jutiapa (vecindad y residencia)
      responses:
        '200':
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/generos:
    get:
      tags: [Catalogos]
      operationId: listarGeneros
      summary: Géneros permitidos
      responses:
        '200':
          description: Lista de géneros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/afiliaciones:
    get:
      tags: [Catalogos]
      operationId: listarAfiliaciones
      summary: Situaciones de afiliación
      responses:
        '200':
          description: Lista de afiliaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/estados:
    get:
      tags: [Catalogos]
      operationId: listarEstados
      summary: Estados del registro en el padrón
      responses:
        '200':
          description: Lista de estados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoItem'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/centros:
    get:
      tags: [Catalogos]
      operationId: listarCentros
      summary: Centros de votación de un municipio
      parameters:
        - name: municipioId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        '200':
          description: Lista de centros de votación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CentroItem'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /api/catalogos/mesas:
    get:
      tags: [Catalogos]
      operationId: listarMesas
      summary: Mesas electorales de un centro de votación
      parameters:
        - name: centroId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        '200':
          description: Lista de mesas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesaItem'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  responses:
    SolicitudInvalida:
      description: Datos con formato inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReglaDeNegocio:
      description: La base de datos rechazó el registro por una regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: Sin coincidencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorInterno:
      description: Error interno inesperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CatalogoItem:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string

    CentroItem:
      type: object
      required: [id, nombre, direccion]
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        direccion:
          type: string

    MesaItem:
      type: object
      required: [id, numero]
      properties:
        id:
          type: integer
          format: int32
        numero:
          type: integer
          format: int32

    RegistroRequest:
      type: object
      required:
        - cui
        - fechaNacimiento
        - primerNombre
        - apellidos
        - leeEscribe
        - vidente
        - tieneDireccionGeoelectoral
        - idGenero
        - idAfiliacion
        - idMuniVecindad
        - idMesa
        - idMuniResidencia
      properties:
        cui:
          type: string
          pattern: '^[0-9]{13}$'
        fechaEmisionDpi:
          type: string
          format: date
        fechaNacimiento:
          type: string
          format: date
        primerNombre:
          type: string
        segundoNombre:
          type: string
        apellidos:
          type: string
        leeEscribe:
          type: boolean
        vidente:
          type: boolean
        tieneDireccionGeoelectoral:
          type: boolean
        idGenero:
          type: integer
          format: int32
        idEstado:
          type: integer
          format: int32
        idAfiliacion:
          type: integer
          format: int32
        idMuniVecindad:
          type: integer
          format: int32
        idMesa:
          type: integer
          format: int32
        idMuniResidencia:
          type: integer
          format: int32

    RegistroResponse:
      type: object
      required: [numeroEmpadronamiento, mensaje]
      properties:
        numeroEmpadronamiento:
          type: string
        mensaje:
          type: string

    TipoDocumento:
      type: string
      enum: [EMPADRONAMIENTO, DPI]

    ConsultaRequest:
      type: object
      required: [tipo, numero, fechaNacimiento, captchaId, captchaRespuesta]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDocumento'
        numero:
          type: string
        fechaNacimiento:
          type: string
          format: date
        captchaId:
          type: string
        captchaRespuesta:
          type: string

    ConsultaResponse:
      type: object
      required: [estado, identificacion, datosPersonales, vecindad, residenciaVotacion]
      properties:
        estado:
          type: string
        identificacion:
          $ref: '#/components/schemas/SeccionIdentificacion'
        datosPersonales:
          $ref: '#/components/schemas/SeccionDatosPersonales'
        vecindad:
          $ref: '#/components/schemas/SeccionVecindad'
        residenciaVotacion:
          $ref: '#/components/schemas/SeccionResidenciaVotacion'

    SeccionIdentificacion:
      type: object
      properties:
        numeroEmpadronamiento:
          type: string
        cui:
          type: string
        fechaEmisionDpi:
          type: string
          format: date

    SeccionDatosPersonales:
      type: object
      properties:
        nombreCompleto:
          type: string
        genero:
          type: string
        leeEscribe:
          type: string
        vidente:
          type: string

    SeccionVecindad:
      type: object
      properties:
        departamento:
          type: string
        municipio:
          type: string

    SeccionResidenciaVotacion:
      type: object
      properties:
        departamentoResidencia:
          type: string
        municipioResidencia:
          type: string
        direccionGeoelectoral:
          type: string
        centroVotacion:
          type: string
        direccionCentro:
          type: string
        municipioCentro:
          type: string
        numeroMesa:
          type: integer
          format: int32
        afiliacion:
          type: string

    CaptchaResponse:
      type: object
      required: [id, imagenBase64, expiraEnSegundos]
      properties:
        id:
          type: string
        imagenBase64:
          type: string
        expiraEnSegundos:
          type: integer
          format: int32

    ErrorResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string